<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Whole Christmas Story — Survey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <img src="nativity-header.jpg" alt="The three wise men traveling by camel across the desert toward the star over the manger in Bethlehem" class="hero-img">
  </div>
  <main class="wrap">
    <header class="page-header">
      <h1>🎄 The Whole Christmas Story</h1>
      <p class="subtitle">One question for all; several more just for you.</p>
    </header>

    <form id="quiz-form" novalidate>
      <div id="questions"></div>

      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <section id="thank-you" class="thank-you" hidden></section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
