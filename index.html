<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Christmas Story — Survey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <img src="nativity-header.jpg" alt="The three wise men traveling by camel across the desert toward the star over the manger in Bethlehem" class="hero-img">
  </div>
  <main class="wrap">
    <header class="page-header">
      <h1>🎄 The Christmas Story</h1>
      <p class="subtitle">A quick survey — one question for everyone, plus a few picked at random just for you.</p>
    </header>

    <form id="quiz-form" novalidate>
      <div id="questions"></div>

      <div id="error-banner" class="error-banner" hidden>
        Something went wrong submitting your answers. Please check your connection and try again.
      </div>

      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <section id="thank-you" class="thank-you" hidden>
      <h2>🎁 Thanks for participating!</h2>
      <p>Your responses have been recorded.</p>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
